[package]
name = "peregrine-data"
description = "Slipstream data plane: streams, tables, Merkle-verifiable reads, and the dual-meter fee model."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["streams"]
# Live subscriber fan-out needs a tokio broadcast channel. Gated so the pure
# parts (tables, merkle, smt, fees) can be depended on without dragging an
# async runtime — which is what lets `peregrine-interop` compile into a RISC-V
# zkVM guest, where tokio/mio cannot build at all.
streams = ["dep:tokio"]

[dependencies]
peregrine-core.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
blake3.workspace = true

[dev-dependencies]
rand.workspace = true
