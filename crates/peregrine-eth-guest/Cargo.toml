# SP1 guest program. Deliberately NOT a member of the root workspace: it
# compiles for `riscv32im-succinct-zkvm-elf` with the Succinct toolchain, so
# `cargo test --workspace` on the host must not try to build it.
[workspace]

[package]
name = "peregrine-eth-guest"
description = "SP1 guest: verifies Ethereum headers and state proofs, committing a Peregrine interop Journal."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# The verification logic itself — the same code the host runs natively. No
# `sp1` feature here: the core is pure and has no zkVM dependency.
peregrine-interop = { path = "../peregrine-interop" }
sp1-zkvm = "6.3"

[patch.crates-io]
# SP1 provides accelerated, constant-time implementations of these primitives
# for the zkVM. Patching them in cuts proving cost dramatically without
# changing any call site — the guest source stays identical to the host's.
# (Left commented until the guest is first built, so the patch versions can be
# pinned to whatever `sp1up` installs; see the README's proving section.)
# sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "..." }
# tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "..." }

[profile.release]
# Guest programs are always built in release; these keep the ELF small and
# deterministic, which matters because the ELF *is* the thing we pin.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
