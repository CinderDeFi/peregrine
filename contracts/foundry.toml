# Foundry project for Peregrine's EVM-side light client.
#
# forge-std is vendored under `lib/` (a git submodule, the Foundry norm).
# Earlier revisions avoided it to keep the checkout submodule-free, but audit
# preparation needs exact revert-selector assertions, fuzzing, and invariant
# runs — none of which are worth reimplementing by hand.
#
#   git submodule update --init --recursive    # or: forge install
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# The ABI cross-check test reads a fixture generated by the Rust test suite.
# Read-only, and scoped to that one directory — a verifier's test harness has
# no reason to touch anything else.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# The vendored SP1 verifier lives under lib/ but is a first-party dependency of
# the end-to-end test, not a test-only helper.
remappings = ["sp1-contracts/=lib/sp1-contracts/"]

# Fail the build on anything the compiler is unhappy about. A verifier is not
# a place to carry warnings.
deny = "warnings"

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32

[fmt]
line_length = 100
tab_width = 4
